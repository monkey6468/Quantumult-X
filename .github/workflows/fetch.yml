name: Fetch

on:
  # 2026-10-19核查：近期自动抓取仅生成空提交，没有更新节点文件。
  # 停止周期空跑，保留本人按需手动抓取；后续不得仅为保活恢复定时触发。
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - name: 迁出代码
      uses: actions/checkout@v2
    - name: 安装Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9.x'
    - name: 设置时区
      run: sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: 安装依赖
      run: |
        pip install requests
        pip install beautifulsoup4
        pip3 install ssr-utils
    - name: 执行任务
      run: |
        python ./Free/1.xxby.py
        python ./Free/2.scope.py
        python ./Free/4.incn.py
        
      
    - name: 提交更改
      run: |
        git config --local user.name "actions@github.com"
        git config --local user.email "GitHub Actions"
        git add .
        git commit --allow-empty -m "$(date '+%Y-%m-%d %H:%M:%S')抓取节点"

    - name: 推送远程
      run:     
        git push
